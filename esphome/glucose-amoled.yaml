                  text: !secret carelink_label
                  text_color: 0x7D8590
                  x: 292
                  y: 0
              - label:
                  id: cl_num
                  text: "--"
                  text_font: font_glucose
                  text_color: 0x5A5A5A
                  x: 282
                  y: 40
              - label:
                  id: cl_arrow
                  text: "\U000F02D6"
                  text_font: icons_trend
                  text_color: 0x5A5A5A
