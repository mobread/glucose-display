# LilyGO T-Display-S3 AMOLED (1.91", 536x240, no touch) as a Home Assistant desk controller.
#
# Pages (hold left to cycle): Glucose -> Lights -> Scenes -> Thermostat
#   Left  button (BOOT, GPIO0):  press = next tile (or next page where there are no tiles;
#                                on the thermostat page: setpoint down 1 degree)
#                                hold  = next page
#   Right button (GPIO21):       press = toggle light / run scene on the highlighted tile
#                                (thermostat page: setpoint up 1 degree)
#                                hold  = screen off / on
# Both buttons also show up in HA as event entities ("press" / "hold") for your own automations.
# After 45 s without a press it goes back to the glucose page; the glucose numbers drift a few
# pixels every 2 minutes so the AMOLED doesn't burn in.
#
# Lights / scenes: the tile widgets, the lt*_on sensors and the ids[] lists in `activate` go together.
# Build / flash:  esphome run esphome/glucose-amoled.yaml
# In HA, enable "Allow the device to perform Home Assistant actions" on the device, or the
# tiles and thermostat buttons can't change anything. Wi-Fi must be HA's own LAN (no WireGuard).

esphome:
  name: glucose-amoled
  friendly_name: Glucose AMOLED
  includes:
    - glucose_helpers.h
  on_boot:
    priority: -100
    then:
      - script.execute: draw_glucose
      - script.execute: draw_thermostat

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Glucose-AMOLED setup"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - script.execute: draw_clock
    on_time_sync:
      then:
        - script.execute: draw_clock

globals:
  - id: page          # 0 glucose, 1 lights, 2 scenes, 3 home
    type: int
    initial_value: "0"
  - id: sel           # highlighted tile on the lights / scenes pages
    type: int
    initial_value: "0"
  - id: pending_set   # setpoint chosen on the device, not yet confirmed by HA
    type: float
    initial_value: "NAN"
  - id: last_input
    type: uint32_t
    initial_value: "0"

# ---------------- display ----------------
spi:
  id: quad_spi
  type: quad
  clk_pin: 47
  data_pins: [18, 7, 48, 5]

display:
  - platform: mipi_spi
    id: amoled
    model: T-DISPLAY-S3-AMOLED
    dimensions:
      width: 536
      height: 240
    transform:          # landscape, USB on the right
      swap_xy: true
      mirror_x: true
      mirror_y: false
    auto_clear_enabled: false
    update_interval: never

light:
  - platform: mipi_spi
    id: screen
    display_id: amoled
    name: Screen
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

font:
  - file: "gfonts://Montserrat@600"
    id: font_glucose
    size: 110
    glyphs: "0123456789-"
  - file: "gfonts://Montserrat@500"
    id: font_temp
    size: 64
    glyphs: "0123456789-.°"
  - file: "gfonts://Montserrat@600"
    id: font_setpoint
    size: 100
    glyphs: "0123456789-.°"
  - file: &mdi
      type: web
      url: https://github.com/Pictogrammers/pictogrammers.github.io/raw/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icons_trend
    size: 72
    glyphs: ["\U000F005D", "\U000F0045", "\U000F0054", "\U000F005C", "\U000F0043", "\U000F02D6"]
  - file: *mdi
    id: icons_tile
    size: 36
    glyphs: ["\U000F0335", "\U000F03D8", "\U000F0374", "\U000F0415"]

lvgl:
  displays: [amoled]
  buffer_size: 100%
  bg_color: 0x000000
  disp_bg_color: 0x000000
  default_font: montserrat_20
  style_definitions:
    - id: tile
      bg_color: 0x141A22
      bg_opa: COVER
      radius: 10
      border_width: 3
      border_color: 0x141A22
      pad_all: 8
    - id: tile_icon
      text_font: icons_tile
      text_color: 0x56606C
  theme:
    obj:
      scrollbar_mode: "OFF"
      checked:
        border_color: 0x58A6FF
    label:
      checked:
        text_color: 0xFFC93C        # light is on
  top_layer:
    widgets:
      - label:
          id: hdr_clock
          text: "--:--"
          text_font: montserrat_20
          text_color: 0x9AA4AF
          x: 10
          y: 7
      - label:
          id: hdr_title
          text: "Glucose"
          text_font: montserrat_20
          text_color: 0x9AA4AF
          align: TOP_RIGHT
          x: -10
          y: 7
  pages:
    - id: pg_glucose
      bg_color: 0x000000
      widgets:
        - obj:
            id: glu_box
            x: 0
            y: 34
            width: 536
            height: 200
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              # Dexcom, left half
              - label:
                  text: "Dexcom"
                  text_color: 0x7D8590
                  x: 24
                  y: 0
              - label:
                  id: dex_num
                  text: "--"
                  text_font: font_glucose
                  text_color: 0x5A5A5A
                  x: 14
                  y: 40
              - label:
                  id: dex_arrow
                  text: "\U000F02D6"
                  text_font: icons_trend
                  text_color: 0x5A5A5A
                  x: 196
                  y: 60
              # second person (Medtronic CareLink), right half
