[platformio]
default_envs = crowpanel-advance-7
boards_dir = boards

; ---------- Elecrow CrowPanel Advance 7" (ESP32-S3, 800x480 RGB) ----------
[env:crowpanel-advance-7]
extends = crowpanel
build_flags = ${crowpanel.build_flags} -DUSE_HA=1

[env:dummy]
extends = crowpanel
build_flags = ${crowpanel.build_flags} -DUSE_HA=0

; ---------- Waveshare ESP32-P4-WIFI6-Touch-LCD-5 (ESP32-P4 rev3, 720x1280 MIPI-DSI) ----------
[env:waveshare-p4-5]
extends = waveshare_p4_5
build_flags = ${waveshare_p4_5.build_flags} -DUSE_HA=1

[env:waveshare-p4-5-dummy]
extends = waveshare_p4_5
build_flags = ${waveshare_p4_5.build_flags} -DUSE_HA=0

[common]
framework = arduino
monitor_speed = 115200
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
	-I include
lib_deps =
	lvgl/lvgl@9.1.0
	bblanchon/ArduinoJson@^7.4.1

[crowpanel]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
upload_port = COM5
monitor_port = COM5
upload_speed = 460800
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
build_flags = ${common.build_flags} -DCONFIG_SPIRAM_SPEED_120M=1
build_src_filter = +<*> -<font_glucose_360.c> -<font_glucose_72.c>
lib_deps =
	${common.lib_deps}
	lovyan03/LovyanGFX@1.2.26

[waveshare_p4_5]
extends = common
; Arduino-ESP32 3.3.13 / ESP-IDF 5.5.6. The *_r3 board selects the "v3.00 or newer" chip
; variant -- required for rev3.x silicon (a pre-v3 build refuses to boot on it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-p4_r3
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_p4.csv
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags = ${common.build_flags} -DBOARD_WAVESHARE_P4_5=1
	-DCONFIG_WIREGUARD_MAX_SRC_IPS=4   ; default 1 is taken by the tunnel address; need room for 0.0.0.0/0
build_src_filter = +<*> -<font_glucose_200.c>
lib_deps =
	${common.lib_deps}
	esphome/wireguard@^0.4.8
