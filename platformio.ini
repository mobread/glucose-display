[platformio]
default_envs = crowpanel-advance-7
boards_dir = boards

[env:crowpanel-advance-7]
extends = base
build_flags = ${base.build_flags} -DUSE_HA=1

[env:dummy]
extends = base
build_flags = ${base.build_flags} -DUSE_HA=0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
upload_port = COM5
upload_speed = 460800
monitor_port = COM5
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
build_flags =
	-DCONFIG_SPIRAM_SPEED_120M=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
	-I include
lib_deps =
	lvgl/lvgl@9.1.0
	lovyan03/LovyanGFX@1.2.26
	bblanchon/ArduinoJson@^7.4.1
